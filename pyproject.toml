[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whispers"
version = "0.2.1"
description = "OIDC-protected secret sharing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "authlib==1.3.1",
  "httpx==0.27.2",
  "Jinja2==3.1.4",
  "python-multipart==0.0.9",
  "itsdangerous==2.2.0",
  "cryptography==43.0.1",
  "SQLAlchemy==2.0.34",
  "psycopg2-binary==2.9.11"
]

[project.optional-dependencies]
dev = ["python-semantic-release>=10"]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.semantic_release]
allow_zero_version = true
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = [
  ".env.example:IMAGE_TAG:nf",
  "README.md:IMAGE_TAG:nf",
]
assets = ["helm/whispers/Chart.yaml"]
build_command = "python3 scripts/update_chart_yaml.py"
